name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test
        env:
          MONGODB_URI_TEST: mongodb://localhost:27017/auth_test

  build:
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        service:
          - { name: gateway, context: gateway }
          - { name: auth-service, context: services/auth-service }
          - { name: user-service, context: services/user-service }
          - { name: product-service, context: services/product-service }
          - { name: order-service, context: services/order-service }

    steps:
      - uses: actions/checkout@v4

      # Solo se comprueba que la imagen construya; no se publica en el registry
      - name: Construir imagen de ${{ matrix.service.name }}
        run: docker build -t ${{ matrix.service.name }}:ci ${{ matrix.service.context }}
