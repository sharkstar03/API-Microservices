global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Los servicios todavia no exponen /metrics: falta instrumentarlos con
  # prom-client. Los targets quedan definidos para que empiecen a reportar
  # en cuanto se añada el endpoint.
  - job_name: "api_gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:3000"]

  - job_name: "auth_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["auth-service:3001"]

  - job_name: "user_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["user-service:3002"]

  - job_name: "product_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["product-service:3003"]

  - job_name: "order_service"
    metrics_path: /metrics
    static_configs:
      - targets: ["order-service:3004"]

  # RabbitMQ trae su propio exporter en el plugin de management
  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq:15692"]
